baseURL = "https://www.eaydin.net/"
locale = "en-us"
title = "Eyup Aydin"
theme = "terminal"
enableRobotsTXT = true
disableKinds = ["RSS", "taxonomy", "term"]

[params]
  contentTypeName = "projects"
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = true
  autoCover = true
  readMore = "Read more"

[params.logo]
  logoText = "Eyup Aydin"
  logoHomeLink = "/"

[params.footer]
  text = ""

[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 1

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 2

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
